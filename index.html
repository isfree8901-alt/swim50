<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07172b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="50m 자유형 배영 평영 스프린트 훈련 및 기록 관리"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>SWIM 50 | 스프린트 트래커</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#eef6ff;background:#071321;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #60d9ff;outline-offset:2px}.app{max-width:600px;margin:auto;min-height:100vh;padding-bottom:110px}.hero{padding:calc(30px + env(safe-area-inset-top)) 20px 20px;background:radial-gradient(circle at 90% 10%,#1b5270 0%,transparent 48%),linear-gradient(155deg,#0d2841,#091728 75%);border-bottom:1px solid #27415d}.eyebrow{color:#65d9f8;letter-spacing:.17em;font-size:11px;font-weight:800}.hero h1{font-size:29px;letter-spacing:-.055em;margin:8px 0 5px}.muted{color:#91a7be;font-size:12px}.hero p{margin:0;color:#bad0e3;font-size:13px}.main{padding:20px 16px}.heading{display:flex;justify-content:space-between;align-items:center;margin:6px 3px 12px;gap:12px}.heading h2{font-size:17px;margin:0}.card{border:1px solid #26405c;border-radius:20px;background:#10243a;padding:17px;margin-bottom:13px;box-shadow:0 8px 25px #00000018}.metricgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{background:#10283e;border:1px solid #26465f;border-radius:16px;padding:14px 9px}.metric .label{font-size:12px;color:#a7bbcf}.metric .num{font-size:25px;font-weight:800;margin-top:5px;letter-spacing:-.05em}.metric .goal{font-size:11px;color:#60dbc4;margin-top:3px}.small{font-size:12px;color:#9bb1c5}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{border-radius:30px;padding:5px 9px;font-size:11px;font-weight:700;background:#1d4054;color:#91e8ef;white-space:nowrap}.primary{border:0;border-radius:13px;background:#4cddda;color:#002c38;font-weight:800;padding:13px 16px}.secondary{border:1px solid #385a76;border-radius:13px;background:#172f48;color:#e8f4fd;padding:11px 13px}.danger{border:1px solid #713e4e;background:#392434;color:#ffb1c1;border-radius:11px;padding:9px 12px}.ghost{border:0;background:none;color:#a7cde5;padding:7px}.full{width:100%}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:10;width:min(100%,600px);display:grid;grid-template-columns:repeat(4,1fr);background:#0d2237ee;backdrop-filter:blur(20px);border-top:1px solid #34506b;padding:9px 6px calc(9px + env(safe-area-inset-bottom))}.tab{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:#829bb1;padding:7px 0;font-size:11px}.tab .ico{font-size:20px}.tab.active{color:#5ce2dc;font-weight:800}.hidden{display:none!important}.workout-row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #25435d;padding:12px 0}.workout-row:last-child{border-bottom:0}.check{appearance:none;min-width:23px;width:23px;height:23px;border-radius:8px;border:2px solid #59738a;background:transparent}.check:checked{background:#4cddda;border-color:#4cddda}.check:checked:after{content:'✓';display:block;text-align:center;color:#00313c;font-weight:900}.workout-row.done .workout-name{text-decoration:line-through;color:#8aa2b8}.workout-name{font-size:13px;font-weight:700}.workout-meta{font-size:11px;color:#91aac0;margin-top:4px;line-height:1.5}.segmented{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px}.segmented button{border:1px solid #30506b;background:#132b43;color:#b3cadb;border-radius:12px;padding:11px;font-weight:750}.segmented button.selected{background:#316478;color:#ecffff;border-color:#63d5d5}.progress{height:7px;background:#254359;border-radius:6px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#42aef6,#55e2c2);transition:width .25s}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:750;color:#b6cede;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #36536d;background:#0b1d31;color:#f1f8ff;border-radius:12px;padding:12px;font-size:15px;min-height:44px}input[type=date]{color-scheme:dark}textarea{min-height:72px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.notice{font-size:12px;line-height:1.7;color:#a8c1d3;background:#152f43;border-left:3px solid #51d5d6;border-radius:7px;padding:12px}.history-item{border-bottom:1px solid #2b455a;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.history-item:last-child{border:0}.history-item strong{font-size:14px}.chart{width:100%;height:180px;display:block;overflow:visible}.stat{font-size:26px;font-weight:850}.timer{text-align:center;padding:20px 0}.timer-display{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.07em}.buttonbar{display:flex;gap:8px;justify-content:center;margin-top:15px}.buttonbar button{min-width:88px}.labeltop{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#64d9e0}.empty{text-align:center;padding:30px;color:#93aec4;font-size:13px}.session-grid{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.session-grid span{padding:7px 11px;border-radius:18px;background:#183b51;color:#bbeef3;font-size:12px}.footnote{font-size:11px;color:#829caf;line-height:1.6}.bottomspace{height:10px}a{color:#80dfff} .toast{position:fixed;z-index:100;bottom:95px;left:50%;transform:translateX(-50%);background:#e0fff7;color:#073b41;padding:11px 18px;border-radius:13px;font-weight:750;font-size:13px;box-shadow:0 8px 40px #0008;max-width:90%;text-align:center}.compact{font-size:12px;line-height:1.5}.chartlegend{display:flex;align-items:center;gap:6px;font-size:11px;color:#adc4d6}.dot{width:9px;height:9px;background:#50dcd6;border-radius:50%}
</style>
</head>
<body>
<div class="app"><header class="hero"><div class="eyebrow">TRAIN SMART · SWIM FAST</div><h1>SWIM <span style="color:#61e4d9">50</span></h1><p>자유형 · 배영 · 평영 50m 스프린트 트래커</p></header><main class="main" id="view"></main><nav class="tabs" aria-label="기능 메뉴"><button class="tab active" data-tab="home"><span class="ico">◈</span>대시보드</button><button class="tab" data-tab="train"><span class="ico">▦</span>훈련</button><button class="tab" data-tab="records"><span class="ico">◷</span>기록</button><button class="tab" data-tab="settings"><span class="ico">⚙</span>설정</button></nav></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';const KEY='swim50_tracker_v1';const STYLES=[{id:'free',name:'자유형',base:31,target:29.9},{id:'back',name:'배영',base:36,target:34.9},{id:'breast',name:'평영',base:37,target:35.9}];const WORKOUTS={A:[['워밍업','자유형 100m + 배영 100m + 평영 100m',300,'편안하게'],['자유형 킥','25m × 4',100,'20초'],['DMC 패들 자유형','25m × 4',100,'30초 / 60~70% 강도'],['자유형 빌드업','25m × 4',100,'30초'],['자유형 전력 스프린트','25m × 6',150,'90~120초'],['자유형 레이스 페이스','50m × 2',100,'3분 / 90~95%'],['배영 전력 스프린트','25m × 4',100,'90~120초'],['평영 킥·타이밍','25m × 4',100,'20초'],['쿨다운','자유형·배영 편하게',150,'—']],B:[['워밍업','3영법 각 100m',300,'편안하게'],['배영 킥','25m × 4',100,'20초'],['배영 몸통 회전 드릴','25m × 4',100,'20초'],['평영 킥','25m × 4',100,'30초'],['배영 전력 스프린트','25m × 4',100,'90~120초'],['평영 전력 스프린트','25m × 6',150,'90~120초'],['배영 레이스 페이스','50m × 2',100,'3분 / 90~95%'],['평영 레이스 페이스','50m × 2',100,'3분 / 90~95%'],['쿨다운','편안한 수영',150,'—']]};
let state=load(),tab='home',plan='A',selectedStyle='free',timerRunning=false,timerStart=0,timerAcc=0,timerInterval=null;
function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function initial(){return {version:1,created:today(),targets:{free:29.9,back:34.9,breast:35.9},baseline:{free:31,back:36,breast:37},logs:[],sessions:[],draft:{A:[],B:[]}}}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)return initial();let obj=JSON.parse(raw);if(!obj||!Array.isArray(obj.logs)||!Array.isArray(obj.sessions))return initial();return {...initial(),...obj,targets:{...initial().targets,...obj.targets},baseline:{...initial().baseline,...obj.baseline},draft:{A:[],B:[],...obj.draft}}}catch(e){return initial()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('저장 실패: 브라우저 저장공간을 확인하세요');return false}}
function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nameFor(id){return STYLES.find(x=>x.id===id)?.name||id}function nice(n){return Number(n).toFixed(2)+'초'}function latest(id,dist=50,start='dive'){let a=state.logs.filter(x=>x.style===id&&x.distance===dist&&x.start===start).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);return a[0]||null}function best(id,dist=50,start='dive'){return state.logs.filter(x=>x.style===id&&x.distance===dist&&x.start===start).sort((a,b)=>a.seconds-b.seconds)[0]||null}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2400)}
function mount(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.getElementById('view').innerHTML=({home:home,train:train,records:records,settings:settings}[tab])();bind()}
function header(title,detail=''){return `<div class="heading"><h2>${title}</h2>${detail}</div>`}
function home(){let count=state.sessions.length;let latestSession=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date))[0];return `${header('현재 50m 기록','<span class="pill">다이빙 출발 기준</span>')}<div class="metricgrid">${STYLES.map(x=>`<div class="metric"><div class="label">${x.name}</div><div class="num">${nice(best(x.id)?.seconds??state.baseline[x.id])}</div><div class="goal">목표 ${nice(state.targets[x.id])}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="flex"><div><div class="labeltop">WEEKLY PLAN</div><h2 style="margin:7px 0 4px;font-size:20px">주 2회 · 1회 1,200m</h2><div class="small">DAY A 자유형 중심 / DAY B 배영·평영 중심</div></div><div style="font-size:34px;color:#50dddd">≈</div></div><div class="session-grid"><span>25m 수영장</span><span>55~65분</span><span>48시간 회복</span></div><button class="primary full" id="startWorkout">오늘 훈련 시작 →</button></div><div class="card"><div class="flex"><div><div class="labeltop">TRAINING LOG</div><div class="stat">${count}<span class="small"> 회 완료</span></div></div><div style="text-align:right"><div class="small">최근 훈련</div><strong>${latestSession?escape(latestSession.date):'아직 없음'}</strong></div></div></div>${header('최근 기록')}<div class="card">${state.logs.length?state.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,4).map(x=>`<div class="history-item"><div><strong>${escape(nameFor(x.style))} ${x.distance}m · ${nice(x.seconds)}</strong><div class="small">${escape(x.date)} · ${x.start==='dive'?'다이빙':'벽 밀기'} 출발</div></div><span class="pill">${x.distance}m</span></div>`).join(''):'<div class="empty">기록 탭에서 첫 측정 기록을 추가하세요.</div>'}<button class="secondary full" id="goRecords" style="margin-top:10px">기록 입력 및 추이 보기</button></div><div class="notice">50m 기준 기록은 다이빙 출발입니다. 자유수영의 벽 밀기 25m 기록과 직접 비교하지 않고 별도로 관리합니다. 8주 목표는 제안값이며 성과를 보장하지 않습니다.</div>`}
function train(){let rows=WORKOUTS[plan],checks=state.draft[plan]||[],done=rows.filter((_,i)=>checks.includes(i)).length,total=rows.reduce((s,r)=>s+r[2],0);return `${header('훈련 루틴','<span class="pill">주 2회</span>')}<div class="segmented"><button id="planA" class="${plan==='A'?'selected':''}">DAY A · 자유형</button><button id="planB" class="${plan==='B'?'selected':''}">DAY B · 배영/평영</button></div><div class="card"><div class="flex"><div><div class="labeltop">TODAY’S SESSION</div><h2 style="margin:6px 0">${plan==='A'?'자유형 최고속도 + 배영 보강':'배영·평영 최고속도'}</h2><div class="small">${total.toLocaleString()}m · 권장 55~65분</div></div><span class="pill">${done}/${rows.length} 완료</span></div><div class="progress" style="margin-top:16px"><span style="width:${done/rows.length*100}%"></span></div>${rows.map((r,i)=>`<label class="workout-row ${checks.includes(i)?'done':''}"><input class="check" type="checkbox" data-check="${i}" ${checks.includes(i)?'checked':''}><span style="flex:1"><span class="workout-name">${escape(r[0])}</span><span class="workout-meta" style="display:block">${escape(r[1])} · ${r[2]}m<br>휴식 ${escape(r[3])}</span></span></label>`).join('')}<div class="field" style="margin-top:17px"><label for="sessionDate">훈련 날짜</label><input type="date" id="sessionDate" value="${today()}"></div><div class="field"><label for="sessionNote">훈련 메모 (선택)</label><textarea id="sessionNote" placeholder="좋았던 점, 힘들었던 구간, 어깨·무릎 상태 등"></textarea></div><button class="primary full" id="completeWorkout">훈련 완료 및 저장 (${done}/${rows.length})</button><button class="ghost full" id="clearChecks">체크 초기화</button></div><div class="card"><div class="labeltop">STOPWATCH</div><div class="timer"><div class="timer-display" id="timerDisplay">${formatTimer(timerAcc)}</div><div class="small">25m 스프린트 및 휴식 시간 측정용</div><div class="buttonbar"><button class="primary" id="timerToggle">${timerRunning?'일시정지':'시작'}</button><button class="secondary" id="timerReset">초기화</button></div></div></div><div class="notice">전력 25m는 반복 후 90~120초 이상 충분히 회복하세요. 기록이 크게 떨어지거나 통증이 있으면 세트를 중단하세요. 패들은 DAY A의 기술 구간에서 사용합니다.</div>`}
function records(){let lst=state.logs.filter(x=>x.style===selectedStyle).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),chartData=state.logs.filter(x=>x.style===selectedStyle&&x.distance===50&&x.start==='dive').sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);return `${header('기록 관리','<span class="pill">영법별 관리</span>')}<div class="segmented" style="grid-template-columns:repeat(3,1fr)">${STYLES.map(x=>`<button data-style="${x.id}" class="${selectedStyle===x.id?'selected':''}">${x.name}</button>`).join('')}</div><div class="card"><div class="flex"><div><div class="small">50m 최고 · 다이빙 출발</div><div class="stat">${nice(best(selectedStyle)?.seconds??state.baseline[selectedStyle])}</div></div><div style="text-align:right"><div class="small">8주 목표</div><div class="stat" style="color:#64e2d8">${nice(state.targets[selectedStyle])}</div></div></div><div class="chartlegend" style="margin-top:20px"><span class="dot"></span>50m 다이빙 기록 추이 (낮을수록 좋음)</div>${makeChart(chartData,state.baseline[selectedStyle],state.targets[selectedStyle])}</div><div class="card"><div class="heading" style="margin:0 0 15px"><h2>새 기록 입력</h2><span class="pill">자동 저장</span></div><form id="recordForm"><div class="field"><label>측정 날짜</label><input name="date" type="date" required value="${today()}"></div><div class="two"><div class="field"><label>거리</label><select name="distance"><option value="25">25m</option><option value="50" selected>50m</option></select></div><div class="field"><label>출발 방식</label><select name="start"><option value="push">벽 밀기</option><option value="dive" selected>다이빙</option></select></div></div><div class="field"><label>기록 (초) — 예: 31.25</label><input name="seconds" inputmode="decimal" type="number" min="1" max="300" step="0.01" required placeholder="31.25"></div><div class="two"><div class="field"><label>스트로크 수 (선택)</label><input name="strokes" inputmode="numeric" type="number" min="1" max="200" placeholder="선택"></div><div class="field"><label>강도 (선택)</label><select name="intensity"><option value="전력">전력</option><option value="90%">90%</option><option value="80%">80%</option><option value="기타">기타</option></select></div></div><div class="field"><label>메모 (선택)</label><input name="note" maxlength="200" placeholder="플립턴, 후반 25m 등"></div><button class="primary full" type="submit">기록 저장</button></form></div>${header('기록 이력',`<span class="pill">${lst.length}건</span>`)}<div class="card">${lst.length?lst.map(x=>`<div class="history-item"><div><strong>${x.distance}m · ${nice(x.seconds)}</strong><div class="small">${escape(x.date)} · ${x.start==='dive'?'다이빙':'벽 밀기'} · ${escape(x.intensity||'전력')}${x.strokes?' · '+x.strokes+'스트로크':''}</div>${x.note?`<div class="small">${escape(x.note)}</div>`:''}</div><button class="ghost" data-delete-log="${x.id}" aria-label="기록 삭제">삭제</button></div>`).join(''):'<div class="empty">아직 입력한 기록이 없습니다.</div>'}</div><div class="notice">25m 기록은 벽 밀기 출발과 다이빙 출발을 구분해 저장합니다. 50m 기록 추이에는 다이빙 출발 기록만 반영합니다.</div>`}
function makeChart(logs,base,target){let data=logs.length?logs.slice(-12).map(x=>({v:x.seconds,label:x.date.slice(5)})):[{v:base,label:'기준'}],vals=data.map(x=>x.v).concat([target,base]),min=Math.floor(Math.min(...vals)-.7),max=Math.ceil(Math.max(...vals)+.7);if(max-min<2)max=min+2;let w=330,h=170,top=18,bottom=30,left=31,right=10,fw=w-left-right,fh=h-top-bottom,x=i=>left+(data.length===1?fw/2:i*fw/(data.length-1)),y=v=>top+(max-v)/(max-min)*fh,poly=data.map((d,i)=>`${x(i)},${y(d.v)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="50m 기록 추이"><line x1="${left}" x2="${w-right}" y1="${y(target)}" y2="${y(target)}" stroke="#6bddb1" stroke-dasharray="4 4" opacity=".8"/><text x="${w-right}" y="${Math.max(12,y(target)-4)}" text-anchor="end" fill="#67e5bd" font-size="9">목표 ${target}</text>${Array.from({length:4},(_,i)=>{let val=min+(max-min)*i/3;return `<line x1="${left}" x2="${w-right}" y1="${y(val)}" y2="${y(val)}" stroke="#34526c" stroke-width=".6"/><text x="${left-5}" y="${y(val)+3}" text-anchor="end" fill="#8faabe" font-size="9">${val.toFixed(1)}</text>`}).join('')}${data.length>1?`<polyline points="${poly}" fill="none" stroke="#5bdbeb" stroke-width="2.5" stroke-linejoin="round"/>`:''}${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.v)}" r="4" fill="#66e7e0" stroke="#15364c" stroke-width="1.5"/><text x="${x(i)}" y="${h-8}" text-anchor="middle" fill="#9db3c5" font-size="9">${escape(d.label)}</text>`).join('')}</svg><div class="footnote">${logs.length?`최근 ${data.length}개 측정값 표시`:'첫 측정 전에는 기존 50m 기준 기록을 표시합니다.'}</div>`}
function settings(){let sess=state.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);return `${header('목표 및 백업')}<div class="card"><div class="labeltop">8-WEEK GOALS</div><p class="small">50m 다이빙 출발 목표를 직접 수정할 수 있습니다.</p><form id="goalsForm">${STYLES.map(x=>`<div class="two"><div class="field"><label>${x.name} 기존 기록</label><input type="number" step=".01" min="1" max="300" name="base_${x.id}" value="${state.baseline[x.id]}" required></div><div class="field"><label>${x.name} 목표 기록</label><input type="number" step=".01" min="1" max="300" name="target_${x.id}" value="${state.targets[x.id]}" required></div></div>`).join('')}<button class="secondary full" type="submit">목표 저장</button></form></div>${header('완료한 훈련',`<span class="pill">${sess.length}회</span>`)}<div class="card">${sess.length?sess.slice(0,25).map(x=>`<div class="history-item"><div><strong>${x.date} · DAY ${x.plan}</strong><div class="small">${x.distance}m · ${x.checked}/${x.total} 항목 완료</div>${x.note?`<div class="small">${escape(x.note)}</div>`:''}</div><button class="ghost" data-delete-session="${x.id}">삭제</button></div>`).join(''):'<div class="empty">저장된 훈련 이력이 없습니다.</div>'}</div><div class="card"><div class="labeltop">YOUR DATA</div><h2>백업 및 복원</h2><p class="small">기록은 현재 브라우저에 저장됩니다. 기기 변경, 브라우저 데이터 삭제에 대비해 JSON 파일을 내려받아 보관하세요.</p><div class="two"><button class="primary" id="export">전체 데이터 백업</button><button class="secondary" id="importBtn">백업 복원</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><p class="footnote">복원 시 현재 데이터가 백업 데이터로 교체됩니다. 다른 기기와 실시간 동기화되지는 않습니다.</p></div><div class="card"><h2>웹앱 설치 / 이용 안내</h2><p class="small">iPhone Safari에서 HTTPS로 게시된 앱을 열고 ‘공유 → 홈 화면에 추가’를 누르면 앱처럼 사용할 수 있습니다. Android Chrome도 ‘홈 화면에 추가’ 또는 ‘앱 설치’를 이용할 수 있습니다.</p><p class="small">로그인 및 서버 동기화가 없는 개인용 버전입니다. 같은 기기·같은 브라우저에서만 데이터가 유지됩니다.</p><button class="danger" id="resetAll">모든 데이터 초기화</button></div>`}
function formatTimer(ms){let cent=Math.floor(ms/10)%100,sec=Math.floor(ms/1000)%60,min=Math.floor(ms/60000);return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(cent).padStart(2,'0')}`}
function updateTimer(){let el=document.getElementById('timerDisplay');if(el)el.textContent=formatTimer(timerAcc+(timerRunning?performance.now()-timerStart:0))}function timerToggle(){if(timerRunning){timerAcc+=performance.now()-timerStart;timerRunning=false;clearInterval(timerInterval)}else{timerStart=performance.now();timerRunning=true;timerInterval=setInterval(updateTimer,35)}mount()}function timerReset(){timerRunning=false;clearInterval(timerInterval);timerAcc=0;mount()}
function bind(){let q=s=>document.querySelector(s);q('#startWorkout')?.addEventListener('click',()=>{tab='train';mount()});q('#goRecords')?.addEventListener('click',()=>{tab='records';mount()});q('#planA')?.addEventListener('click',()=>{plan='A';mount()});q('#planB')?.addEventListener('click',()=>{plan='B';mount()});document.querySelectorAll('[data-check]').forEach(e=>e.addEventListener('change',()=>{let n=Number(e.dataset.check),s=new Set(state.draft[plan]||[]);e.checked?s.add(n):s.delete(n);state.draft[plan]=[...s];save();let date=q('#sessionDate')?.value,note=q('#sessionNote')?.value;mount();if(q('#sessionDate'))q('#sessionDate').value=date;if(q('#sessionNote'))q('#sessionNote').value=note}));q('#clearChecks')?.addEventListener('click',()=>{if(confirm('현재 체크를 모두 초기화할까요?')){state.draft[plan]=[];save();mount()}});q('#completeWorkout')?.addEventListener('click',()=>{let rows=WORKOUTS[plan],checks=state.draft[plan]||[];if(!checks.length){toast('완료한 항목을 먼저 체크하세요');return}let date=q('#sessionDate').value,note=q('#sessionNote').value.trim();if(!date){toast('훈련 날짜를 입력하세요');return}let distance=rows.reduce((s,r,i)=>s+(checks.includes(i)?r[2]:0),0);state.sessions.push({id:Date.now(),date,plan,checked:checks.length,total:rows.length,distance,note});state.draft[plan]=[];save();toast('훈련 이력이 저장되었습니다');mount()});q('#timerToggle')?.addEventListener('click',timerToggle);q('#timerReset')?.addEventListener('click',timerReset);document.querySelectorAll('[data-style]').forEach(e=>e.addEventListener('click',()=>{selectedStyle=e.dataset.style;mount()}));q('#recordForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.currentTarget),sec=Number(f.get('seconds')),dist=Number(f.get('distance')),strokes=f.get('strokes')?Number(f.get('strokes')):null;if(!Number.isFinite(sec)||sec<=0||sec>300){toast('올바른 기록을 입력하세요');return}state.logs.push({id:Date.now(),date:String(f.get('date')),style:selectedStyle,distance:dist,start:String(f.get('start')),seconds:Math.round(sec*100)/100,strokes,intensity:String(f.get('intensity')),note:String(f.get('note')||'')});save();toast('기록을 저장했습니다');mount()});document.querySelectorAll('[data-delete-log]').forEach(e=>e.addEventListener('click',()=>{if(confirm('이 기록을 삭제할까요?')){state.logs=state.logs.filter(x=>String(x.id)!==e.dataset.deleteLog);save();mount()}}));document.querySelectorAll('[data-delete-session]').forEach(e=>e.addEventListener('click',()=>{if(confirm('훈련 이력을 삭제할까요?')){state.sessions=state.sessions.filter(x=>String(x.id)!==e.dataset.deleteSession);save();mount()}}));q('#goalsForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.currentTarget);for(const x of STYLES){state.targets[x.id]=Number(f.get('target_'+x.id));state.baseline[x.id]=Number(f.get('base_'+x.id))}save();toast('목표가 변경되었습니다');mount()});q('#export')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='swim50-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('백업 파일이 생성되었습니다')});q('#importBtn')?.addEventListener('click',()=>q('#importFile').click());q('#importFile')?.addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('파일이 너무 큽니다');let obj=JSON.parse(await f.text());if(!Array.isArray(obj.logs)||!Array.isArray(obj.sessions)||typeof obj.targets!=='object'||typeof obj.baseline!=='object')throw Error('올바른 백업 형식이 아닙니다');if(!confirm('현재 기록을 백업 파일로 교체하시겠습니까?'))return;state={...initial(),...obj,draft:{A:[],B:[],...obj.draft}};save();toast('백업 복원 완료');mount()}catch(err){toast('복원 실패: '+err.message)}});q('#resetAll')?.addEventListener('click',()=>{if(confirm('기록과 훈련 이력을 모두 삭제합니다. 계속할까요?')&&confirm('정말 초기화하시겠습니까?')){state=initial();save();mount();toast('초기화 완료')}})}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;mount();window.scrollTo(0,0)}));mount();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
